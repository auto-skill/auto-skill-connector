[project]
name = "aws-cost-optimizer-backend"
version = "0.1.0"
description = "FastAPI backend that surfaces AWS cost visibility and savings recommendations, nOps-style."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
