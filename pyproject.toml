[project]
name = "auto-skill-connector"
version = "0.1.0"
description = "Find, preview, and safely install reusable AI agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
auto-skill = "auto_skill_cli:main"
auto-skill-mcp = "mcp_server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["auto_skill_cli", "auto_skill_core", "mcp_server"]
