[project]
name = "auto-skill-connector"
version = "0.1.0"
description = "Trusted Agent Skill discovery and compatibility for Claude Code, Codex, and Cursor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
auto-skill = "auto_skill_cli:main"
auto-skill-mcp = "mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["auto_skill_cli", "auto_skill_core", "auto_skill_auth", "mcp_server", "mcp_oauth_provider"]
# hooks/skill_suggest.py must ship with the package -- auto_skill_cli's
# enable-hook/doctor commands locate it relative to their own installed
# location (Path(__file__).parent / "hooks" / "skill_suggest.py"). Without
# this, `pip install .` and the README's `uvx --from git+...` install path
# both silently omit it, and enable-hook fails with "hook script not found"
# for anyone who installed this way instead of cloning the repo.
packages = ["hooks"]
