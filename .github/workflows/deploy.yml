name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

# A deploy rebuilds the images on the Droplet and warms a large local index.
# cancel-in-progress means a fast follow-up push supersedes an in-flight
# deploy rather than queuing behind it, so back-to-back pushes never stack
# overlapping CPU spikes on the Droplet.
concurrency:
  group: autoskill-production-deploy
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  backend-ci:
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    needs: [test, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_PATH: /home/runner/.ssh/deploy_key
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/autoskill-deploy"
          bash backend/deploy/deploy_droplet.sh 2>&1 | tee "$RUNNER_TEMP/autoskill-deploy/deploy.log"

      # GitHub's live log API can be temporarily unavailable during an Actions
      # incident. Preserve the complete deploy transcript for later retrieval.
      - name: Upload deployment diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autoskill-deploy/deploy.log
          if-no-files-found: error
          retention-days: 30
