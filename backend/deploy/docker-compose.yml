services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      LOCAL_DB_PATH: /data/local_skills.db
      AUTO_START_SCRAPER: "0"
      AUTO_START_EMBEDDER: "0"
      ENABLE_OLLAMA_CHAT: "0"
      AUTOSKILL_CONTEXT_GUARD: ${AUTOSKILL_CONTEXT_GUARD:-1}
      AUTOSKILL_VALIDATED_CAPSULE_DIGESTS: ${AUTOSKILL_VALIDATED_CAPSULE_DIGESTS:-}
      SKILLS_SH_OIDC_TOKEN: ${SKILLS_SH_OIDC_TOKEN:-}
      SKILLS_SH_OIDC_TOKEN_FILE: ${SKILLS_SH_OIDC_TOKEN_FILE:-}
      SKILLS_SH_API_URL: ${SKILLS_SH_API_URL:-https://skills.sh/api/v1}
      SKILLS_SH_PUBLIC_PAGE_METADATA: ${SKILLS_SH_PUBLIC_PAGE_METADATA:-1}
      AUTOSKILL_SKILLS_SH_ROUTING: ${AUTOSKILL_SKILLS_SH_ROUTING:-1}
      AUTOSKILL_ALLOW_LOCAL_RETRIEVAL_FALLBACK: ${AUTOSKILL_ALLOW_LOCAL_RETRIEVAL_FALLBACK:-0}
      AUTOSKILL_SKILLS_SH_SEARCH_LIMIT: ${AUTOSKILL_SKILLS_SH_SEARCH_LIMIT:-12}
      SKILLS_SH_DISCOVERY_LIMIT: ${SKILLS_SH_DISCOVERY_LIMIT:-50}
      SKILLSMP_DISCOVERY_LIMIT: ${SKILLSMP_DISCOVERY_LIMIT:-100}
      AUTOSKILL_FREE_ROUTES_PER_MONTH: ${AUTOSKILL_FREE_ROUTES_PER_MONTH:-250}
      STALE_SCRAPE_RUN_SECONDS: ${STALE_SCRAPE_RUN_SECONDS:-7200}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-https://skills.autoskill.dev}
      AUTO_SKILL_DASHBOARD_ORIGINS: ${AUTO_SKILL_DASHBOARD_ORIGINS:-https://autoskill.dev,https://www.autoskill.dev,https://skills.autoskill.dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID_AUTOSKILL: ${GITHUB_CLIENT_ID_AUTOSKILL:-}
      GITHUB_CLIENT_SECRET_AUTOSKILL: ${GITHUB_CLIENT_SECRET_AUTOSKILL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_ACCESS_MODE: disabled
      ADMIN_HOST: ${ADMIN_HOST:-127.0.0.1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_TEAM_SEAT: ${STRIPE_PRICE_TEAM_SEAT:-}
      STRIPE_DASHBOARD_TEST_MODE: ${STRIPE_DASHBOARD_TEST_MODE:-0}
    volumes:
      - ../data:/data
      - ../skills_library:/app/skills_library
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn scraper:app --host 0.0.0.0 --port 8000
    init: true
    mem_limit: 1536m
    cpus: "1.50"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin-local:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      LOCAL_DB_PATH: /data/local_skills.db
      AUTO_START_SCRAPER: "0"
      AUTO_START_EMBEDDER: "0"
      # The founder UI does not serve route requests; do not duplicate the
      # API's ONNX model plus vector/lexical caches in this process.
      AUTOSKILL_WARM_SEARCH_RUNTIME: "0"
      ENABLE_OLLAMA_CHAT: "0"
      AUTOSKILL_FREE_ROUTES_PER_MONTH: ${AUTOSKILL_FREE_ROUTES_PER_MONTH:-250}
      ADMIN_ACCESS_MODE: ssh
      ADMIN_HOST: ${ADMIN_HOST:-127.0.0.1}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      STRIPE_DASHBOARD_TEST_MODE: ${STRIPE_DASHBOARD_TEST_MODE:-0}
    volumes:
      - ../data:/data
      - ../skills_library:/app/skills_library:ro
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - admin-isolation
    command: uvicorn scraper:app --host 0.0.0.0 --port 8000
    init: true
    mem_limit: 768m
    cpus: "0.50"
    pids_limit: 192
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.connector
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      AUTOSKILL_URL: http://api:8000
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-https://skills.autoskill.dev}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-https://mcp.autoskill.dev}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp.autoskill.dev,localhost:8765,127.0.0.1:8765}
      # install_skill writes files on whoever hosts this server -- never on
      # by default over the public streamable-http connector (see
      # mcp_server.py's _public_install_enabled()).
      AUTO_SKILL_ENABLE_PUBLIC_INSTALL: "0"
    ports:
      - "127.0.0.1:8765:8765"
    command: auto-skill-mcp
    init: true
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Explicit local/off-host collector only. It is never part of the default
    # production stack and cannot enter an automatic OOM restart loop.
    #
    # Runs only inside this container, never as a bare host `python.exe` --
    # this name is what you look for in `docker ps`/`docker stop`, not Task
    # Manager, so a host-level Python cleanup can never touch it by accident.
    container_name: autoskill-local-collector-worker
    profiles: ["collector"]
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      LOCAL_DB_URL: http://api:8000
      AUTO_START_SCRAPER: "0"
      AUTO_START_EMBEDDER: "0"
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-3600}
      STALE_SCRAPE_RUN_SECONDS: ${STALE_SCRAPE_RUN_SECONDS:-7200}
      WORKER_ONCE: "1"
      EMBED_PAGE_SIZE: ${EMBED_PAGE_SIZE:-64}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-8}
      EMBED_UPSERT_CHUNK: ${EMBED_UPSERT_CHUNK:-50}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
    volumes:
      - ../skills_library:/app/skills_library
    command: python worker.py
    init: true
    mem_limit: ${COLLECTOR_MEMORY_LIMIT:-1024m}
    cpus: "${COLLECTOR_CPU_LIMIT:-0.75}"
    pids_limit: 256

  cloudflared:
    image: cloudflare/cloudflared@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
    restart: always
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 128

  litestream:
    image: litestream/litestream@sha256:83f04e91edc7980095d03de58f1cca3697e1138a60e466eb11e4dcd4d5effbfa
    restart: always
    user: "0:0"
    depends_on:
      api:
        condition: service_healthy
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
    volumes:
      - ../data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate -config /etc/litestream.yml
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128

  library-backup:
    image: alpine:3.20
    restart: always
    entrypoint: ["/bin/sh", "/scripts/backup-library.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_LIBRARY_PREFIX: ${R2_LIBRARY_PREFIX:-skills-library}
      LITESTREAM_REPLICA_PREFIX: ${LITESTREAM_REPLICA_PREFIX:-local_skills.db}
      R2_DB_BACKUP_PREFIX: ${R2_DB_BACKUP_PREFIX:-alpha-host-backups}
      LIBRARY_BACKUP_INTERVAL_SECONDS: ${LIBRARY_BACKUP_INTERVAL_SECONDS:-86400}
      LIBRARY_BACKUP_START_DELAY_SECONDS: ${LIBRARY_BACKUP_START_DELAY_SECONDS:-300}
      LIBRARY_BACKUP_NICE_LEVEL: ${LIBRARY_BACKUP_NICE_LEVEL:-19}
    volumes:
      - ../skills_library:/library:ro
      - ../data/backups:/backups
      - ./backup-library.sh:/scripts/backup-library.sh:ro
      - ./purge-route-db-backups.sh:/scripts/purge-route-db-backups.sh:ro
    mem_limit: 512m
    cpus: "0.25"
    pids_limit: 128

  db-inspector:
    image: datasetteproject/datasette:0.65.2
    profiles: ["db-inspector"]
    read_only: true
    user: "10001:10001"
    environment:
      HOME: /tmp
    volumes:
      - ../data:/data:ro
    ports:
      - "127.0.0.1:8001:8001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - db-inspection
    command:
      - datasette
      - /data/local_skills.db
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --setting
      - allow_download
      - "off"
      - --setting
      - sql_time_limit_ms
      - "1000"
      - --setting
      - max_returned_rows
      - "500"

networks:
  admin-isolation:
  db-inspection:
    internal: true
